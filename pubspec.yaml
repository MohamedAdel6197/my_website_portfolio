name: my_website_portfolio
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  flutter_svg: ^2.2.3
  font_awesome_flutter: ^10.12.0
  gap: ^3.0.1
  intl: any
  localingo: ^1.1.0
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.10.5
  

flutter:
  # generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/l10n/

    
  fonts:
    - family: Dosis
      fonts:
        - asset: assets/fonts/Dosis-Regular.ttf
        - asset: assets/fonts/Dosis-Bold.ttf
          weight: 700
        - asset: assets/fonts/Dosis-medium.ttf    
          weight: 500
    - family: Beiruti
      fonts:
        - asset: assets/fonts/Beiruti-Regular.ttf
        - asset: assets/fonts/Beiruti-Bold.ttf
          weight: 700
        - asset: assets/fonts/Beiruti-Medium.ttf    
          weight: 500  
